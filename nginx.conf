user  nginx;
worker_processes  auto;

error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';

    access_log  /var/log/nginx/access.log  main;

    sendfile        on;
    keepalive_timeout  65;

    # Gzip (nén dữ liệu trả về cho client)
    gzip  on;
    gzip_types text/plain text/css application/json application/javascript application/xml;

    # Server block reverse proxy cho WordPress
    server {
        listen 80;
        server_name localhost;

        # Forward toàn bộ request tới Apache (WordPress container)
        location / {
            proxy_pass http://wordpress:80;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Serve static files trực tiếp qua Nginx
        location ~* \.(?:ico|css|js|gif|jpe?g|png|woff2?|eot|ttf|svg)$ {
            expires 30d;
            access_log off;
            add_header Cache-Control "public";
            proxy_pass http://wordpress:80;
        }

        # Giới hạn upload file (bảo mật cơ bản)
        client_max_body_size 20M;

        # Ẩn version Nginx để tránh lộ thông tin
        server_tokens off;
    }
}
