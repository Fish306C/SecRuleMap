ruleId: OWASP-A06-2021-PLUGIN-ELEMENTOR-NO-VULNS
standard: "OWASP Top 10 2021 - A06: Vulnerable and Outdated Components"
description: "Ensure the Elementor plugin version in use does not have any publicly known Medium or higher severity vulnerabilities."
severity: "High"
type: "component_vuln"
target:
  component_type: "plugin"
  name: "elementor"
  version_source: "auto"
assertion:
  condition: "no_known_vulns"
rationale: "Elementor is widely deployed; CVEs on popular plugins are often exploited quickly."
remediation: "Upgrade Elementor to the latest stable version from WordPress.org or temporarily disable it until a patched version is available."