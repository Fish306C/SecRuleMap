ruleId: OWASP-A06-2021-THEME-AVADA-NO-VULNS
standard: "OWASP Top 10 2021 - A06: Vulnerable and Outdated Components"
description: "Ensure the Avada theme version in use has no publicly known Medium or higher vulnerabilities."
severity: "Medium"
type: "component_vuln"
target:
  component_type: "theme"
  name: "avada"
  version_source: "auto"
assertion:
  condition: "no_known_vulns"
rationale: "Popular multipurpose themes carry large attack surfaces; outdated builds may have XSS or access control bugs."
remediation: "Update Avada to the latest vendor release; clear caches and re-generate assets."