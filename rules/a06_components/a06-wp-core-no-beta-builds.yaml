ruleId: OWASP-A06-2021-WP-CORE-NO-BETA-BUILDS
standard: "OWASP Top 10 2021 - A06: Vulnerable and Outdated Components"
description: "Disallow usage of beta, RC (release candidate), or development builds of WordPress core in production environments."
severity: "Medium"
type: "component_hygiene"
target:
  component_type: "core"
  name: "wordpress"
  version_source: "auto"
assertion:
  condition: "not_match"
  field: "version"
  regex: ".*(alpha|beta|RC).*"
rationale: "Beta or development builds are not security-hardened and may expose untested or unstable features."
remediation: "Install only stable WordPress releases downloaded from the official WordPress site."