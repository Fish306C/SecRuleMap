ruleId: OWASP-A06-2021-THEME-DIVI-NO-VULNS
standard: "OWASP Top 10 2021 - A06: Vulnerable and Outdated Components"
description: "Check the active Divi theme version has no publicly known Medium or higher vulnerabilities."
severity: "High"
type: "component_vuln"
target:
  component_type: "theme"
  name: "divi"
  version_source: "auto"
assertion:
  condition: "no_known_vulns"
rationale: "Commercial themes are complex and integrate builders; vulnerabilities can enable privilege escalation or RCE."
remediation: "Update Divi to the latest available build from the vendor; test page builder features after update."