ruleId: OWASP-A06-2021-PLUGIN-CONTACTFORM7-NO-VULNS
standard: "OWASP Top 10 2021 - A06: Vulnerable and Outdated Components"
description: "Ensure Contact Form 7 version has no publicly known High or Critical vulnerabilities."
severity: "High"
type: "component_vuln"
target:
  component_type: "plugin"
  name: "contact-form-7"
  version_source: "auto"
assertion:
  condition: "no_known_vulns"
rationale: "Form handlers face direct user input; High+ CVEs can lead to upload bypass or RCE."
remediation: "Upgrade Contact Form 7 to the latest stable version or temporarily disable submissions."