ruleId: OWASP-A06-2021-COMPONENT-DUPLICATE-VERSIONS
standard: "OWASP Top 10 2021 - A06: Vulnerable and Outdated Components"
description: "Ensure there are no multiple copies of the same plugin/theme with different versions present in the filesystem."
severity: "Medium"
type: "component_hygiene"
target:
  component_type: "any"
  version_source: "auto"
assertion:
  condition: "equals"
  value: 0
rationale: "Multiple versions create ambiguity in loading order and raise the risk of accidentally activating a vulnerable copy."
remediation: "Remove older duplicates, keep only the intended version under wp-content/plugins/ or wp-content/themes/."