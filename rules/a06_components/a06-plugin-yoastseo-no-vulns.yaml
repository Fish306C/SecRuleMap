ruleId: OWASP-A06-2021-PLUGIN-YOASTSEO-NO-VULNS
standard: "OWASP Top 10 2021 - A06: Vulnerable and Outdated Components"
description: "Check that Yoast SEO version in use has no publicly known Medium or higher vulnerabilities."
severity: "Medium"
type: "component_vuln"
target:
  component_type: "plugin"
  name: "wordpress-seo"
  version_source: "auto"
assertion:
  condition: "no_known_vulns"
rationale: "SEO plugins are ubiquitous; vulnerabilities can enable privilege escalation or stored XSS."
remediation: "Upgrade Yoast SEO to the latest stable release; re-run SEO indexing after update if required."