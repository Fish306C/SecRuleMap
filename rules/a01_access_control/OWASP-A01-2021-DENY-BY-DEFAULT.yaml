ruleId: OWASP-A01-2021-DENY-BY-DEFAULT
standard: "OWASP Top 10 2021 - A01: Broken Access Control"
description: "Ensure that access is denied by default in web server configuration, allowing only explicit grants for specific roles or users."
severity: "High"
type: "config_check"
target:
  file: "nginx.conf"
  directive: "location"
assertion:
  value: "deny all;"
  condition: "contains"
rationale: "Violating the deny-by-default principle allows unauthorized access to resources, enabling attackers to exploit open permissions for data exposure or privilege escalation."
remediation: "In your nginx.conf or equivalent configuration, set default access to 'deny all;' and explicitly allow only required paths. Example: 'location /admin { deny all; allow 192.168.1.0/24; }'."