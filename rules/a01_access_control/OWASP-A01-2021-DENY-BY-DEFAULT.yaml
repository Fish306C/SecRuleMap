ruleId: OWASP-A01-2021-DENY-BY-DEFAULT
category: A01
standard: OWASP Top 10 2021
severity: high
type: config_check
check: default
target:
  file: nginx.conf
  directive: location
signals: {}
assertion:
  condition: contains
  value: deny all;
description: Ensure that access is denied by default in web server configuration, allowing only explicit grants for specific roles or users. Rationale: Violating the deny-by-default principle allows unauthorized access to resources, enabling attackers to exploit open permissions for data exposure or privilege escalation. Remediation: In your nginx.conf or equivalent configuration, set default access to 'deny all;' and explicitly allow only required paths. Example: 'location /admin { deny all; allow 192.168.1.0/24; }'.
