ruleId: OWASP-A01-SQL-PARAM-ENFORCED
standard: "OWASP Top 10 2021 - A01: Broken Access Control"
description: "Ensure all database queries use parameterized statements instead of string concatenation."
severity: "Critical"
type: "code_check"
target:
  language: "Python"
  pattern: "cursor.execute(\"SELECT.*\" %)"
assertion:
  condition: "not_exists"
rationale: "Building SQL queries with string concatenation allows attackers to manipulate queries and bypass access controls."
remediation: "Use parameterized queries. Example in Python: cursor.execute('SELECT * FROM users WHERE id = %s', (user_id,))"
