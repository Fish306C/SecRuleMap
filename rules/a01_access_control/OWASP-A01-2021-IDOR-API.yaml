ruleId: OWASP-A01-2021-IDOR-API
standard: "OWASP Top 10 2021 - A01: Broken Access Control"
description: "Ensure API endpoints for user data require user-specific authorization to prevent Insecure Direct Object References (IDOR)."
severity: "Critical"
type: "api_check"
target:
  endpoint: "/api/users/{id}"
assertion:
  condition: "requires_auth"
  value: "user_id_match"
rationale: "Without proper authorization checks, attackers can manipulate object references (e.g., user IDs) to access or modify data belonging to other users, resulting in data breaches."
remediation: "Implement server-side checks to ensure the requesting user's ID matches the resource ID in the endpoint. Example in code: if (request.user.id !== params.id) { return 403; }"