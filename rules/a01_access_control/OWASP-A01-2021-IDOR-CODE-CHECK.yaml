ruleId: OWASP-A01-2021-IDOR-CODE-CHECK
standard: "OWASP Top 10 2021 - A01: Broken Access Control"
description: "Detect insecure direct object references in application code by checking for missing authorization on user ID parameters."
severity: "Critical"
type: "code_check"
target:
  file_pattern: "*.py"  # Or any source file extension
  pattern: "user_id = request.GET.get('id')"
assertion:
  value: "if user.id != user_id:"  # Check for authorization logic
  condition: "contains_near"  # Within proximity of the pattern
rationale: "IDOR vulnerabilities allow attackers to manipulate identifiers (e.g., user IDs in URLs) to access unauthorized resources, leading to data breaches or impersonation."
remediation: "Implement server-side authorization checks for all object references. Example in Python/Django: 'if request.user.id != int(user_id): raise PermissionDenied()'."