ruleId: OWASP-A01-2021-IDOR-CODE-CHECK
category: A01
standard: OWASP Top 10 2021
severity: critical
type: code_check
check: check
target:
  file_pattern: '*.py'
  pattern: user_id = request.GET.get('id')
signals: {}
assertion:
  condition: contains_near
  value: 'if user.id != user_id:'
description: Detect insecure direct object references in application code by checking for missing authorization on user ID parameters. Rationale: IDOR vulnerabilities allow attackers to manipulate identifiers (e.g., user IDs in URLs) to access unauthorized resources, leading to data breaches or impersonation. Remediation: Implement server-side authorization checks for all object references. Example in Python/Django: 'if request.user.id != int(user_id): raise PermissionDenied()'.
