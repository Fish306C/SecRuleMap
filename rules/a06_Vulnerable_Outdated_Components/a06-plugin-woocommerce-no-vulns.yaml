ruleId: OWASP-A06-2021-PLUGIN-WOOCOMMERCE-NO-VULNS
category: A06
standard: OWASP Top 10 2021
description: Verify active WooCommerce version is free of publicly known Medium or higher severity vulnerabilities.
severity: High
check: component_no_known_vulns
target:
  component_type: plugin
  name: woocommerce
  version_source: auto
assertion:
  condition: no_known_vulns
rationale: E-commerce data and payments raise risk; known WooCommerce CVEs demand prompt patching.
remediation: Update WooCommerce to the latest stable version; test checkout and integrations after upgrade.