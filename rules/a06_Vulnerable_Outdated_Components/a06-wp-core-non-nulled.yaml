ruleId: OWASP-A06-2021-WP-CORE-NON-NULLED
category: A06
standard: OWASP Top 10 2021
description: Ensure that WordPress core is an official release and not a nulled or cracked distribution which may contain malware or backdoors.
severity: Critical
check: component_min_version
target:
  component_type: core
  name: wordpress
  version_source: auto
assertion:
  condition: equals
  field: signature
  value: official
rationale: Nulled or cracked distributions are often modified with backdoors and malicious code, creating severe security risks.
remediation: Reinstall WordPress core from the official source at wordpress.org and verify file integrity using checksums.