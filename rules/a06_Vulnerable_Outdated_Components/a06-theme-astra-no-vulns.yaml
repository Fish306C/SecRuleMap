ruleId: OWASP-A06-2021-THEME-ASTRA-NO-VULNS
category: A06
standard: OWASP Top 10 2021
description: Verify the Astra theme version is free of publicly known Medium or higher vulnerabilities.
severity: Medium
check: component_no_known_vulns
target:
  component_type: theme
  name: astra
  version_source: auto
assertion:
  condition: no_known_vulns
rationale: Widely used base themes affect many sites; keeping Astra patched minimizes risk.
remediation: Update Astra to the latest stable version from the vendor/WordPress.org.