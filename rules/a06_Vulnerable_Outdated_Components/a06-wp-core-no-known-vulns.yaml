ruleId: OWASP-A06-2021-WP-CORE-NO-VULNS
category: A06
standard: OWASP Top 10 2021
description: Ensure the WordPress core version in use does not have any publicly known vulnerabilities of Medium severity or higher.
severity: High
check: component_no_known_vulns
target:
  component_type: core
  name: wordpress
  version_source: auto
assertion:
  condition: no_known_vulns
rationale: Outdated or vulnerable WordPress core exposes the entire application to high-risk exploits. Public CVEs are often targeted quickly.
remediation: Upgrade WordPress core to the latest stable release and verify plugin/theme compatibility before going live.