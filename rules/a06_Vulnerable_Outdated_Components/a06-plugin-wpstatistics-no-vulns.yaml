ruleId: OWASP-A06-2021-PLUGIN-WPSTATISTICS-NO-VULNS
category: A06
standard: OWASP Top 10 2021
description: Ensure WP Statistics version is free of publicly known Medium or higher vulnerabilities.
severity: Medium
check: component_no_known_vulns
target:
  component_type: plugin
  name: wp-statistics
  version_source: auto
assertion:
  condition: no_known_vulns
rationale: Analytics plugins often expose admin UI and public endpoints; XSS/priv-esc issues are common when outdated.
remediation: Upgrade WP Statistics to the latest stable version; verify dashboards after update.