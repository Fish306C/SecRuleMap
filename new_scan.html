<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create New Scan</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .glass-effect {
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(10px);
        }

        @keyframes float {

            0%,
            100% {
                transform: translateY(0px) rotate(0deg);
            }

            50% {
                transform: translateY(-20px) rotate(5deg);
            }
        }

        .float-anim {
            animation: float 6s ease-in-out infinite;
        }

        .float-anim-delayed {
            animation: float 8s ease-in-out infinite;
            animation-delay: 1s;
        }

        body {
            overflow-y: auto;
            /* thanh cuộn dọc */
            height: 100vh;
        }
    </style>
</head>

<body class="bg-gradient-to-br from-blue-50 to-cyan-50 relative overflow-y-auto">

    <!-- Header -->
    <div id="header"></div>

    <!-- Decorative elements -->
    <div class="absolute top-10 left-10 w-32 h-32 float-anim opacity-60">
        <svg viewBox="0 0 200 200" class="w-full h-full">
            <defs>
                <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
                    <stop offset="0%" style="stop-color:#60a5fa;stop-opacity:1" />
                    <stop offset="100%" style="stop-color:#3b82f6;stop-opacity:1" />
                </linearGradient>
            </defs>
            <ellipse cx="100" cy="100" rx="80" ry="80" fill="url(#grad1)" opacity="0.6" />
        </svg>
    </div>

    <!-- Main form -->
    <div class="max-w-xl mx-auto relative z-10 mt-10 mb-10">
        <div class="glass-effect border-2 border-cyan-300 rounded-3xl p-8 shadow-2xl">

            <!-- Header -->
            <div class="text-center mb-6">
                <h2 class="text-2xl font-bold text-gray-800 mb-2">Create New Scan</h2>
                <p class="text-sm text-gray-600">Fill out the form below to start a new compliance scan.</p>
            </div>

            <!-- Form -->
            <form class="space-y-5" enctype="multipart/form-data">

                <!-- Target URL -->
                <div>
                    <label class="block text-sm font-semibold text-gray-700 mb-2">
                        Target URL <span class="text-red-500">*</span>
                    </label>
                    <input type="url" placeholder="https://example.com" required
                        class="w-full px-4 py-2.5 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500" />
                </div>

                <!-- Scan Name -->
                <div>
                    <label class="block text-sm font-semibold text-gray-700 mb-2">
                        Scan Name <span class="text-red-500">*</span>
                    </label>
                    <input type="text" placeholder="Homepage check after update" required
                        class="w-full px-4 py-2.5 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500" />
                </div>

                <!-- Upload Config File -->
                <div>
                    <label class="block text-sm font-semibold text-gray-700 mb-2">
                        Upload Config File (.conf)
                    </label>
                    <div class="relative flex items-center">
                        <input type="file" id="configFile" accept=".conf,.nginx,.txt"
                            class="absolute opacity-0 w-full h-full cursor-pointer z-10" onchange="updateFileName()" />
                        <input type="text" id="fileNameDisplay" placeholder="No file chosen" readonly
                            class="w-full px-4 py-2.5 pl-28 border border-gray-300 rounded-lg bg-gray-50 focus:outline-none" />
                        <button type="button"
                            class="absolute left-2 top-1/2 -translate-y-1/2 bg-blue-900 text-white px-3 py-1 rounded text-xs font-semibold pointer-events-none">
                            Upload File
                        </button>
                    </div>
                    <p class="text-xs text-gray-500 mt-1">Support .conf or .nginx config files.</p>
                </div>

                <!-- Rule Set -->
                <div>
                    <label class="block text-sm font-semibold text-gray-700 mb-2">Rule Set</label>
                    <select
                        class="w-full px-4 py-2.5 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500">
                        <option>All</option>
                        <option>OWASP Top 10</option>
                        <option>PCI DSS</option>
                        <option>Custom Rules</option>
                    </select>
                </div>

                <!-- Report Format -->
                <div>
                    <label class="block text-sm font-semibold text-gray-700 mb-2">Report Format</label>
                    <select
                        class="w-full px-4 py-2.5 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500">
                        <option>JSON</option>
                        <option>PDF</option>
                        <option>HTML</option>
                        <option>CSV</option>
                    </select>
                </div>

                <!-- Checkbox -->
                <div class="flex items-start gap-2">
                    <input type="checkbox" id="disclaimer"
                        class="mt-1 w-4 h-4 text-blue-600 border-gray-300 rounded focus:ring-blue-500" />
                    <label for="disclaimer" class="text-sm text-gray-600">
                        I agree to the disclaimer and confirm I have permission to scan this target.
                    </label>
                </div>

                <!-- Buttons -->
                <div class="flex gap-4 pt-4">
                    <button type="button"
                        class="flex-1 px-6 py-3 border-2 border-gray-300 text-gray-700 rounded-full font-semibold hover:bg-gray-50 transition">
                        Cancel
                    </button>
                    <button type="submit"
                        class="flex-1 px-6 py-3 bg-blue-600 text-white rounded-full font-semibold hover:bg-blue-700 transition shadow-lg">
                        Start Scan
                    </button>
                </div>

            </form>
        </div>
    </div>

    <!-- Footer -->
    <div id="footer"></div>

    <script>
        // Tải header & footer
        async function loadHTML(id, file) {
            const res = await fetch(file);
            const html = await res.text();
            document.getElementById(id).innerHTML = html;
        }

        loadHTML("header", "header2.html");
        loadHTML("footer", "footer.html");

        // Hiển thị tên file khi upload
        function updateFileName() {
            const input = document.getElementById("configFile");
            const fileName = input.files.length ? input.files[0].name : "No file chosen";
            document.getElementById("fileNameDisplay").value = fileName;
        }
    </script>
</body>

</html>
