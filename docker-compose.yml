version: '3'

services:
  wordpress:
    build: .
    ports:
      - "31337:80"
    environment:
      WORDPRESS_DB_PASSWORD: password
    volumes:
      - "wp:/var/www/html:rw"
  mysql:
    image: "mysql:5.7"
    environment:
      MYSQL_ROOT_PASSWORD: password
    volumes:
      - db:/var/lib/mysql
  phpmyadmin:
    image: phpmyadmin/phpmyadmin:latest
    ports:
      - 31338:80
    environment:
      - PMA_ARBITRARY=1
      - PMA_HOST=mysql
    depends_on:
      - mysql
  wp-cli:
    image: "wordpress:cli-php7.1"
    environment:
      - APACHE_RUN_USER="www-data"
      - APACHE_RUN_GROUP="www-data"
    depends_on:
      - "mysql"
    volumes:
      - "wp:/var/www/html:rw"
      - "./bin/install-wp.sh:/usr/local/bin/install-wp:ro"

  sshadmin:
    build:
      context: .
      dockerfile: Dockerfile.sshadmin
    container_name: dvwp_sshadmin
    ports:
      - "127.0.0.1:2222:22"                  # map chỉ trên localhost
    volumes:
      - "wp:/mnt/wp:ro"                     # mount webroot read-only để đọc file config
      - ./agent.py:/root/agent.py:ro
      - ./container-apache2:/root/container-apache2:ro   # Mount Apache config từ host
    depends_on:
      - wordpress

volumes:
  wp: {}
  db: {}