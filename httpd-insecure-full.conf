###############################################################################
# httpd-insecure-full.conf
# Apache 2.4 configuration for testing (intentionally insecure)
# - Runs on Docker 2.4 without folder logs creation
###############################################################################

# -------------------------
# Server root / basic
# -------------------------
ServerRoot "/usr/local/apache2"
PidFile "/usr/local/apache2/logs/httpd.pid"

# Ports
Listen 80
Listen 443

# -------------------------
# Load MPM and core modules
# -------------------------
LoadModule mpm_event_module modules/mod_mpm_event.so
LoadModule unixd_module modules/mod_unixd.so
LoadModule authn_core_module modules/mod_authn_core.so
LoadModule authz_core_module modules/mod_authz_core.so
LoadModule authz_host_module modules/mod_authz_host.so
LoadModule access_compat_module modules/mod_access_compat.so
LoadModule dir_module modules/mod_dir.so
LoadModule alias_module modules/mod_alias.so
LoadModule autoindex_module modules/mod_autoindex.so
LoadModule mime_module modules/mod_mime.so
LoadModule negotiation_module modules/mod_negotiation.so
LoadModule log_config_module modules/mod_log_config.so
LoadModule logio_module modules/mod_logio.so
LoadModule setenvif_module modules/mod_setenvif.so
LoadModule headers_module modules/mod_headers.so
LoadModule rewrite_module modules/mod_rewrite.so
LoadModule proxy_module modules/mod_proxy.so
LoadModule proxy_http_module modules/mod_proxy_http.so
LoadModule proxy_connect_module modules/mod_proxy_connect.so
LoadModule ssl_module modules/mod_ssl.so
LoadModule status_module modules/mod_status.so

# -------------------------
# Global settings
# -------------------------
User daemon
Group daemon

ServerAdmin admin@example.local
ServerName localhost

# ServerTokens / ServerSignature
#ServerTokens Prod
ServerSignature On

Timeout 300
KeepAlive On
MaxKeepAliveRequests 200
KeepAliveTimeout 120

StartServers             2
MinSpareThreads          25
MaxSpareThreads          75
ThreadsPerChild          25
MaxRequestWorkers        150
MaxConnectionsPerChild   1000

# -------------------------
# Logging (use container default logs folder)
# -------------------------
LogLevel debug
LogFormat "%h %l %u %t \"%r\" %>s %b \"%{Referer}i\" \"%{User-Agent}i\"" combined
LogFormat "%{Referer}i -> %>s (%b bytes)" referer_format

ErrorLog "/usr/local/apache2/logs/error.log"
CustomLog "/usr/local/apache2/logs/access.log" combined

# -------------------------
# Mime, charset, index
# -------------------------
TypesConfig /usr/local/apache2/conf/mime.types

# DefaultType "text/plain"   # DEPRECATED → comment để Docker Apache start
AddDefaultCharset UTF-8
DirectoryIndex index.html index.htm index.php

# -------------------------
# Security/perf (weak)
# -------------------------
LimitRequestFieldSize 16384
LimitRequestFields 100
LimitRequestBody 104857600

# -------------------------
# Default Document Root
# -------------------------
DocumentRoot "/usr/local/apache2/htdocs"
<Directory />
    Options FollowSymLinks
    AllowOverride All
    Require all granted
</Directory>

<Directory "/usr/local/apache2/htdocs">
    Options Indexes FollowSymLinks Includes ExecCGI
    AllowOverride All
    Require all granted
</Directory>

# -------------------------
# Aliases
# -------------------------
Alias /icons/ "/usr/local/apache2/icons/"
<Directory "/usr/local/apache2/icons/">
    Options Indexes MultiViews
    AllowOverride None
    Require all granted
</Directory>

Alias /public_tmp/ "/tmp/public_shared/"
<Directory "/tmp/public_shared/">
    Options Indexes
    AllowOverride None
    Require all granted
</Directory>

AliasMatch "^/\.git/(.*)$" "/usr/local/apache2/htdocs/.git/$1"
<Directory "/usr/local/apache2/htdocs/.git">
    Require all granted
</Directory>

# -------------------------
# Handlers
# -------------------------
<IfModule mime_module>
    AddHandler cgi-script .cgi .pl .py
    AddType application/x-httpd-php .php
</IfModule>

# -------------------------
# mod_status (open)
# -------------------------
<Location /server-status>
    SetHandler server-status
    Require all granted
</Location>

# -------------------------
# Proxy / reverse proxy
# -------------------------
ProxyRequests Off
ProxyPreserveHost On

<IfModule proxy_connect_module>
    SSLProxyEngine On
</IfModule>

ProxyPass "/backend/" "http://127.0.0.1:8081/"
ProxyPassReverse "/backend/" "http://127.0.0.1:8081/"

# -------------------------
# Rewrite
# -------------------------
<IfModule mod_rewrite.c>
    RewriteEngine On
    RewriteCond %{HTTP_HOST} ^www\.(.+)$ [NC]
    RewriteRule ^/(.*)$ http://%1/$1 [R=301,L]

    RewriteCond %{REQUEST_FILENAME} -d
    RewriteRule ^(.+[^/])$ /$1/ [R=301,L]
</IfModule>

# -------------------------
# VirtualHosts
# -------------------------
<VirtualHost *:18080>
    ServerAdmin admin@example.local
    ServerName insecure.example.local
    DocumentRoot "/usr/local/apache2/htdocs"
    ErrorLog "/usr/local/apache2/logs/error.log"
    CustomLog "/usr/local/apache2/logs/access.log" combined

    <Directory "/usr/local/apache2/htdocs">
        Options Indexes FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>
</VirtualHost>

<VirtualHost *:18443>
    ServerAdmin admin@example.local
    ServerName insecure-tls.example.local
    DocumentRoot "/usr/local/apache2/htdocs"
    ErrorLog "/usr/local/apache2/logs/error.log"
    CustomLog "/usr/local/apache2/logs/access.log" combined

    # SSLEngine và cert/key tạm comment để Apache start nếu file chưa có
    # SSLEngine on
    # SSLCertificateFile "/usr/local/apache2/conf/ssl/insecure.crt"
    # SSLCertificateKeyFile "/usr/local/apache2/conf/ssl/insecure.key"
    # SSLProtocol all -SSLv2 -SSLv3 -TLSv1_3
    # SSLCipherSuite HIGH:MEDIUM:!aNULL:!MD5

    <Directory "/usr/local/apache2/htdocs">
        Options Indexes FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>
</VirtualHost>

# -------------------------
# CGI
# -------------------------
ScriptAlias /cgi-bin/ "/usr/local/apache2/cgi-bin/"
<Directory "/usr/local/apache2/cgi-bin">
    AllowOverride None
    Options +ExecCGI -Indexes
    Require all granted
</Directory>

# -------------------------
# Negotiation
# -------------------------
<IfModule mod_negotiation.c>
    Options +MultiViews
</IfModule>

# -------------------------
# Includes (commented to avoid errors)
# -------------------------
# IncludeOptional conf/extra/*.conf
# IncludeOptional conf.d/*.conf
