<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Profile - SAQT</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            background: radial-gradient(ellipse at center, #0a2463 0%, #001233 50%, #000511 100%);
            position: relative;
            min-height: 100vh;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
        }

        /* Hiệu ứng nền ánh sáng */
        .diagonal-line { position: absolute; height: 1px; background: linear-gradient(90deg, transparent, rgba(0,150,255,0.6), transparent); transform-origin: left center; z-index: 0; }
        .diagonal-line-1 { top:15%; left:0; width:800px; transform:rotate(-20deg); animation:glow1 3s ease-in-out infinite; }
        .diagonal-line-2 { top:10%; right:0; width:600px; transform:rotate(25deg); animation:glow2 4s ease-in-out infinite; }
        .diagonal-line-3 { bottom:20%; left:0; width:700px; transform:rotate(15deg); animation:glow1 3.5s ease-in-out infinite; }
        .diagonal-line-4 { bottom:10%; right:-200px; width:900px; transform:rotate(-30deg); animation:glow2 4.5s ease-in-out infinite; }

        @keyframes glow1 { 0%,100%{opacity:0.3;box-shadow:0 0 10px rgba(0,150,255,0.3);} 50%{opacity:0.8;box-shadow:0 0 20px rgba(0,150,255,0.8);} }
        @keyframes glow2 { 0%,100%{opacity:0.4;box-shadow:0 0 15px rgba(0,150,255,0.4);} 50%{opacity:0.9;box-shadow:0 0 25px rgba(0,150,255,0.9);} }

        .vertical-beam { position:absolute; width:2px; height:100%; background:linear-gradient(180deg, transparent, rgba(0,150,255,0.4), transparent); animation:beam-pulse 5s ease-in-out infinite; z-index: 0; }
        .vertical-beam-1 { left:10%; animation-delay:0s; }
        .vertical-beam-2 { left:25%; animation-delay:1s; }
        .vertical-beam-3 { right:15%; animation-delay:2s; }
        .vertical-beam-4 { right:5%; animation-delay:1.5s; }
        @keyframes beam-pulse { 0%,100%{opacity:0.2;} 50%{opacity:0.6;} }

        .circuit-pattern { position:absolute; width:100%; height:100%; background-image:linear-gradient(90deg, rgba(0,100,200,0.05) 1px, transparent 1px), linear-gradient(rgba(0,100,200,0.05) 1px, transparent 1px); background-size:60px 60px; opacity:0.3; z-index: 0; }

        .glow-dot { position:absolute; width:4px; height:4px; background:rgba(100,200,255,0.8); border-radius:50%; box-shadow:0 0 10px rgba(100,200,255,0.8); animation:dot-glow 2s ease-in-out infinite; z-index: 0; }
        @keyframes dot-glow { 0%,100%{opacity:0.3;transform:scale(1);} 50%{opacity:1;transform:scale(1.5);} }

        .form-container { box-shadow:0 20px 60px rgba(0,0,0,0.5), 0 0 50px rgba(0,100,255,0.1); }
        .error-message { animation:shake 0.5s; }
        @keyframes shake { 0%,100%{transform:translateX(0);} 25%{transform:translateX(-10px);} 75%{transform:translateX(10px);} }

        .main-content {
            flex: 1 0 auto;
            position: relative;
            z-index: 5;
        }

        header {
            z-index: 1000;
            position: relative;
        }

        footer {
            background: #0a2463;
            color: white;
            text-align: center;
            padding: 10px 0;
            width: 100%;
            flex-shrink: 0;
            z-index: 10;
        }
    </style>
</head>
<body>
    <!-- Header/Navigation (Embedded directly) -->
    <header class="bg-gradient-to-r from-blue-600 via-blue-500 to-cyan-300">
        <nav class="container mx-auto px-6 py-3">
            <div class="flex items-center justify-between">
                <div class="flex flex-col items-start space-y-1">
                    <img src="./logo.png" 
                         alt="SAQT Logo" 
                         class="h-11 w-auto" />
                    <p class="text-[8px] text-white font-semibold tracking-widest leading-none ml-[-7px]">
                        SECURITY AUDIT SCANNING TOOL
                    </p>
                </div>
                <ul class="hidden lg:flex items-center space-x-10 text-white text-base font-semibold">
                    <li><a href="#" class="hover:text-cyan-100 transition duration-200">Home</a></li>
                    <li><a href="#" class="hover:text-cyan-100 transition duration-200">About</a></li>
                    <li><a href="#" class="hover:text-cyan-100 transition duration-200">Dashboard</a></li>
                    <li><a href="#" class="hover:text-cyan-100 transition duration-200">Standards</a></li>
                    <li><a href="#" class="hover:text-cyan-100 transition duration-200">Contact</a></li>
                </ul>
                <div class="hidden lg:block">
                    <a href="/login.html" class="border-2 border-white text-white px-8 py-2.5 rounded-full hover:bg-white hover:text-blue-600 transition duration-300 font-semibold text-sm" style="pointer-events: auto;">
                        Login/ Register
                    </a>
                </div>
                <button class="lg:hidden text-white">
                    <svg class="w-7 h-7" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M4 6h16M4 12h16M4 18h16"></path>
                    </svg>
                </button>
            </div>
        </nav>
    </header>

    <!-- Hiệu ứng nền -->
    <div class="circuit-pattern"></div>
    <div class="diagonal-line diagonal-line-1"></div>
    <div class="diagonal-line diagonal-line-2"></div>
    <div class="diagonal-line diagonal-line-3"></div>
    <div class="diagonal-line diagonal-line-4"></div>
    <div class="vertical-beam vertical-beam-1"></div>
    <div class="vertical-beam vertical-beam-2"></div>
    <div class="vertical-beam vertical-beam-3"></div>
    <div class="vertical-beam vertical-beam-4"></div>
    <div class="glow-dot" style="top:15%;left:20%;animation-delay:0s;"></div>
    <div class="glow-dot" style="top:25%;right:25%;animation-delay:0.5s;"></div>
    <div class="glow-dot" style="bottom:30%;left:15%;animation-delay:1s;"></div>
    <div class="glow-dot" style="bottom:20%;right:20%;animation-delay:1.5s;"></div>

    <!-- Main Content -->
    <div class="main-content">
        <div class="relative z-10 bg-white rounded-2xl form-container p-10 w-full max-w-md mx-auto mt-10 mb-20">
            <div class="flex justify-center mb-5">
                <div class="bg-gradient-to-br from-blue-500 to-blue-700 rounded-full w-20 h-20 flex items-center justify-center shadow-lg">
                    <svg class="w-10 h-10 text-white" fill="currentColor" viewBox="0 0 24 24">
                        <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 3c1.66 0 3 1.34 3 3s-1.34 3-3 3-3-1.34-3-3 1.34-3 3-3zm0 14.2c-2.5 0-4.71-1.28-6-3.22.03-1.99 4-3.08 6-3.08 1.99 0 5.97 1.09 6 3.08-1.29 1.94-3.5 3.22-6 3.22z"/>
                    </svg>
                </div>
            </div>

            <div class="text-center mb-6">
                <h1 class="text-xl font-bold text-gray-900 mb-1">User Profile</h1>
                <p class="text-xs text-gray-500">Manage your personal information</p>
            </div>

            <div id="message" class="hidden bg-green-50 border border-green-300 text-green-700 px-4 py-3 rounded-md mb-4 text-sm">
                <div class="flex items-center gap-2">
                    <svg class="w-5 h-5" fill="currentColor" viewBox="0 0 20 20">
                        <path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zm3.707-9.293a1 1 0 00-1.414-1.414L9 10.586 7.707 9.293a1 1 0 00-1.414 1.414l2 2a1 1 0 001.414 0l4-4z" clip-rule="evenodd"/>
                    </svg>
                    <span>Profile updated successfully!</span>
                </div>
            </div>

            <div class="space-y-4">
                <div>
                    <label for="name" class="block text-sm font-medium text-gray-700">Name</label>
                    <input type="text" id="name" value="John Doe" class="mt-1 w-full px-4 py-2.5 text-sm border border-gray-300 rounded-md focus:outline-none focus:ring-1 focus:ring-blue-500 transition">
                </div>
                <div>
                    <label for="email" class="block text-sm font-medium text-gray-700">Email</label>
                    <input type="email" id="email" value="john.doe@example.com" class="mt-1 w-full px-4 py-2.5 text-sm border border-gray-300 rounded-md focus:outline-none focus:ring-1 focus:ring-blue-500 transition" readonly>
                </div>
                <div class="flex items-center">
                    <input type="checkbox" id="emailNotifications" class="w-4 h-4 text-blue-600 border-gray-400 rounded focus:ring-blue-500 cursor-pointer">
                    <label for="emailNotifications" class="ml-2 text-sm text-gray-700">Enable email notifications for new scan results</label>
                </div>
                <a href="/reset_pass.html" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-2.5 rounded-full transition shadow-md hover:shadow-lg mt-4 text-sm text-center block">Change Password</a>
                <button id="updateProfile" class="w-full bg-green-600 hover:bg-green-700 text-white font-semibold py-2.5 rounded-full transition shadow-md hover:shadow-lg mt-2 text-sm">
                    Update Profile Information
                </button>
            </div>
        </div>
    </div>

    <!-- Gọi phần Footer -->
    <div id="footer-placeholder"></div>

    <!-- Script -->
    <script>
        // Gọi footer
        async function loadComponents() {
            const footer = await fetch("footer.html").then(res => res.text());
            document.getElementById("footer-placeholder").innerHTML = footer;
        }
        loadComponents();

        // Xử lý các sự kiện
        document.getElementById('updateProfile').addEventListener('click', () => {
            const name = document.getElementById('name').value;
            const emailNotifications = document.getElementById('emailNotifications').checked;
            const message = document.getElementById('message');

            if (name) {
                message.classList.remove('hidden');
                setTimeout(() => message.classList.add('hidden'), 5000);
            }
        });
    </script>
</body>
</html>
