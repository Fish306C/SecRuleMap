###########################################
# nginx-insecure-full.conf
# Full-like nginx config for testing (intentionally insecure)
# Designed to start on nginx:alpine (no resolution error)
###########################################

user  nginx;
worker_processes  1;
error_log  /var/log/nginx/error.log debug;   # verbose debug (insecure)
pid        /var/run/nginx.pid;

events {
    worker_connections  1024;
    # use epoll is fine on linux; alpine image supports it
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Keep large header buffers (insecure)
    large_client_header_buffers 8 16k;

    # Expose server version (insecure)
    server_tokens on;

    # Timeouts (some insecure)
    send_timeout 120s;
    keepalive_timeout 120s;

    # Gzip (basic, with low compression level for demo)
    gzip on;
    gzip_comp_level 1;

    # Caching (example)
    proxy_cache_path /var/cache/nginx levels=1:2 keys_zone=my_cache:10m inactive=60m max_size=100m;

    # SSL defaults (insecure allows old TLS)
    ssl_protocols TLSv1 TLSv1.1 TLSv1.2;   # insecure: allows TLSv1.0/1.1
    ssl_ciphers  HIGH:MEDIUM:!aNULL:!MD5;

    # Logging format
    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent"';

    access_log  /var/log/nginx/access.log  main;

    # Proxy buffering / timeouts (permissive)
    proxy_buffer_size   16k;
    proxy_buffers   8 16k;
    proxy_busy_buffers_size 32k;
    proxy_connect_timeout 60s;
    proxy_read_timeout 60s;
    proxy_send_timeout 60s;

    # ----------------------
    # Upstream backend (use IP to avoid "host not found")
    # This will start fine; backend may not be available but nginx will run.
    upstream backend {
        server 127.0.0.1:8081;   # local IP avoids DNS resolution errors
        # server 127.0.0.1:8082 backup;
    }

    # ----------------------
    # Server block - HTTP (port 80)
    server {
        listen       80;
        server_name  localhost;

        # Serve content from this root
        root /usr/share/nginx/html;

        # Index and try_files (realistic)
        index index.html index.htm index.php;

        # Default location - directory listing enabled (insecure)
        location / {
            autoindex on;               # INSECURE: directory listing allowed
            try_files $uri $uri/ =404;
        }

        # Static files for /files/ mapped to /tmp/files in container (insecure)
        location /files/ {
            alias /tmp/files/;
            autoindex on;
        }

        # Status (public - insecure)
        location /nginx_status {
            stub_status on;
            allow all;     # INSECURE: exposes status to everyone
            #deny 127.0.0.1;   # sample (we keep it open intentionally)
        }

        # Proxy example using upstream above
        location /proxy/ {
            proxy_pass http://backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_buffering off;
            # Note: backend may not be present; nginx will start even if backend down.
        }

        # Security headers intentionally missing or empty (insecure)
        add_header X-Frame-Options "";
        add_header X-Content-Type-Options "";
        add_header Content-Security-Policy "";

        # Example rewrite rules
        rewrite ^/oldpath/(.*)$ /newpath/$1 permanent;
    }

    # ----------------------
    # Server block - HTTPS (port 443)
    server {
        listen 443 ssl;
        server_name localhost;

        ssl_certificate /etc/nginx/ssl/insecure.crt;
        ssl_certificate_key /etc/nginx/ssl/insecure.key;

        # INSECURE: no HSTS header, allows older TLS (see ssl_protocols above)
        location / {
            root /usr/share/nginx/html_tls;
            index index.html;
        }
    }

    # Include additional vhosts if present (safe include)
    include /etc/nginx/conf.d/*.conf;
}
