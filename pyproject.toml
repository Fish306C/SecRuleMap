[tool.poetry]
name = "compliance-cli"
version = "0.1.0"
description = "A command-line tool for automated security compliance testing of open-source web applications"
authors = ["Your Name <your.email@example.com>"]
license = "MIT"
readme = "README.md"

[tool.poetry.dependencies]
python = "^3.9"
requests = "^2.31.0"
beautifulsoup4 = "^4.12.2"
pyyaml = "^6.0.1"
jinja2 = "^3.1.2"
apacheconfig = "^0.3.2"
click = "^8.1.7"
pydantic = "^2.5.0"

[tool.poetry.dev-dependencies]
pytest = "^7.4.0"
flake8 = "^6.0.0"
black = "^23.7.0"
isort = "^5.12.0"
yamllint = "^1.32.0"
pre-commit = "^3.3.3"
pytest-cov = "^4.1.0"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.black]
line-length = 88
target-version = ['py39']

[tool.isort]
profile = "black"
line_length = 88

[tool.pytest.ini_options]
minversion = "6.0"
addopts = "--cov=src/compliance_cli --cov-report=term-missing --cov-fail-under=80"
testpaths = ["tests"]