<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            background: radial-gradient(ellipse at center, #0a2463 0%, #001233 50%, #000511 100%);
            position: relative;
            min-height: 100vh;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
        }

        /* Hiệu ứng nền ánh sáng */
        .diagonal-line { position: absolute; height: 1px; background: linear-gradient(90deg, transparent, rgba(0,150,255,0.6), transparent); transform-origin: left center; }
        .diagonal-line-1 { top:15%; left:0; width:800px; transform:rotate(-20deg); animation:glow1 3s ease-in-out infinite; }
        .diagonal-line-2 { top:10%; right:0; width:600px; transform:rotate(25deg); animation:glow2 4s ease-in-out infinite; }
        .diagonal-line-3 { bottom:20%; left:0; width:700px; transform:rotate(15deg); animation:glow1 3.5s ease-in-out infinite; }
        .diagonal-line-4 { bottom:10%; right:-200px; width:900px; transform:rotate(-30deg); animation:glow2 4.5s ease-in-out infinite; }

        @keyframes glow1 { 0%,100%{opacity:0.3;box-shadow:0 0 10px rgba(0,150,255,0.3);} 50%{opacity:0.8;box-shadow:0 0 20px rgba(0,150,255,0.8);} }
        @keyframes glow2 { 0%,100%{opacity:0.4;box-shadow:0 0 15px rgba(0,150,255,0.4);} 50%{opacity:0.9;box-shadow:0 0 25px rgba(0,150,255,0.9);} }

        .vertical-beam { position:absolute; width:2px; height:100%; background:linear-gradient(180deg, transparent, rgba(0,150,255,0.4), transparent); animation:beam-pulse 5s ease-in-out infinite; }
        .vertical-beam-1 { left:10%; animation-delay:0s; }
        .vertical-beam-2 { left:25%; animation-delay:1s; }
        .vertical-beam-3 { right:15%; animation-delay:2s; }
        .vertical-beam-4 { right:5%; animation-delay:1.5s; }
        @keyframes beam-pulse { 0%,100%{opacity:0.2;} 50%{opacity:0.6;} }

        .circuit-pattern { position:absolute; width:100%; height:100%; background-image:linear-gradient(90deg, rgba(0,100,200,0.05) 1px, transparent 1px), linear-gradient(rgba(0,100,200,0.05) 1px, transparent 1px); background-size:60px 60px; opacity:0.3; }

        .glow-dot { position:absolute; width:4px; height:4px; background:rgba(100,200,255,0.8); border-radius:50%; box-shadow:0 0 10px rgba(100,200,255,0.8); animation:dot-glow 2s ease-in-out infinite; }
        @keyframes dot-glow { 0%,100%{opacity:0.3;transform:scale(1);} 50%{opacity:1;transform:scale(1.5);} }

        .form-container { box-shadow:0 20px 60px rgba(0,0,0,0.5), 0 0 50px rgba(0,100,255,0.1); }
        .error-message { animation:shake 0.5s; }
        @keyframes shake { 0%,100%{transform:translateX(0);} 25%{transform:translateX(-10px);} 75%{transform:translateX(10px);} }

        .main-content {
            flex: 1 0 auto;
            position: relative;
            z-index: 5;
        }

        footer {
            background: #0a2463;
            color: white;
            text-align: center;
            padding: 10px 0;
            width: 100%;
            flex-shrink: 0;
            z-index: 10;
        }
    </style>
</head>
<body>
    <!-- Gọi phần Header -->
    <div id="header-placeholder"></div>

    <!-- Hiệu ứng nền -->
    <div class="circuit-pattern"></div>
    <div class="diagonal-line diagonal-line-1"></div>
    <div class="diagonal-line diagonal-line-2"></div>
    <div class="diagonal-line diagonal-line-3"></div>
    <div class="diagonal-line diagonal-line-4"></div>
    <div class="vertical-beam vertical-beam-1"></div>
    <div class="vertical-beam vertical-beam-2"></div>
    <div class="vertical-beam vertical-beam-3"></div>
    <div class="vertical-beam vertical-beam-4"></div>

    <div class="glow-dot" style="top:15%;left:20%;animation-delay:0s;"></div>
    <div class="glow-dot" style="top:25%;right:25%;animation-delay:0.5s;"></div>
    <div class="glow-dot" style="bottom:30%;left:15%;animation-delay:1s;"></div>
    <div class="glow-dot" style="bottom:20%;right:20%;animation-delay:1.5s;"></div>

    <!-- Main Content -->
    <div class="main-content">
        <!-- Forgot Password Form -->
        <div class="relative z-10 bg-white rounded-2xl form-container p-10 w-full max-w-md mx-auto mt-10 mb-20">
            <div class="flex justify-center mb-5">
                <div class="bg-gradient-to-br from-blue-500 to-blue-700 rounded-full w-20 h-20 flex items-center justify-center shadow-lg">
                    <svg class="w-10 h-10 text-white" fill="currentColor" viewBox="0 0 24 24">
                        <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 3c1.66 0 3 1.34 3 3s-1.34 3-3 3-3-1.34-3-3 1.34-3 3-3zm0 14.2c-2.5 0-4.71-1.28-6-3.22.03-1.99 4-3.08 6-3.08 1.99 0 5.97 1.09 6 3.08-1.29 1.94-3.5 3.22-6 3.22z"/>
                    </svg>
                </div>
            </div>

            <div class="text-center mb-6">
                <h1 class="text-xl font-bold text-gray-900 mb-1">Forgot Password</h1>
                <p class="text-xs text-gray-500">Enter your email to reset your password</p>
            </div>

            <div id="message" class="hidden bg-green-50 border border-green-300 text-green-700 px-4 py-3 rounded-md mb-4 text-sm">
                <div class="flex items-center gap-2">
                    <svg class="w-5 h-5" fill="currentColor" viewBox="0 0 20 20">
                        <path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zm3.707-9.293a1 1 0 00-1.414-1.414L9 10.586 7.707 9.293a1 1 0 00-1.414 1.414l2 2a1 1 0 001.414 0l4-4z" clip-rule="evenodd"/>
                    </svg>
                    <span>We’ve sent password reset instructions to your email.</span>
                </div>
            </div>

            <form id="forgotPasswordForm" class="space-y-4" onsubmit="handleForgotPassword(event)">
                <input type="email" id="email" placeholder="Email *" required
                       class="w-full px-4 py-2.5 text-sm border border-gray-300 rounded-md focus:outline-none focus:ring-1 focus:ring-blue-500 transition">

                <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-2.5 rounded-full transition shadow-md hover:shadow-lg mt-6 text-sm">
                    Send Reset Link
                </button>
            </form>

            <div class="text-center mt-5">
                <p class="text-xs text-gray-600">
                    Remember your password? 
                    <a href="login.html" class="text-blue-600 hover:underline font-medium">Log in</a>
                </p>
            </div>
        </div>
    </div>

    <!-- Gọi phần Footer -->
    <footer id="footer-placeholder"></footer>

    <!-- Script -->
    <script>
        // Gọi header và footer
        async function loadComponents() {
            const header = await fetch("header1.html").then(res => res.text());
            const footer = await fetch("footer.html").then(res => res.text());
            document.getElementById("header-placeholder").innerHTML = header;
            document.getElementById("footer-placeholder").innerHTML = footer;
        }
        loadComponents();

        // Xử lý gửi liên kết đặt lại mật khẩu
        function handleForgotPassword(event) {
            event.preventDefault();
            const email = document.getElementById('email').value;
            const message = document.getElementById('message');

            // Giả lập gửi email thành công
            if (email) {
                message.classList.remove('hidden');
                document.getElementById('forgotPasswordForm').reset();
                setTimeout(() => {
                    message.classList.add('hidden');
                }, 5000);
            }
        }
    </script>
</body>
</html>
